# caso.yaml — datos GLOBALES del caso (empresa, misión, proyecto).
# El contenido de cada celda de la matriz vive en matriz/[1-6]-*.md.
# Para cambiar de empresa (p. ej. la del compa) basta con editar este archivo
# ({empresa}, {area} y {proyecto} dentro de los textos se reemplazan solos)
# y regenerar: `uv run --with openpyxl --with pyyaml python sabsa/build_xlsx.py`.
# En las slides, los nombres viven en beamer/caso.tex (\empresa, \area, \proyecto).
#
# Cómo se lee cada capa (según el docente):
#   contextual  → conversación con el dueño del negocio; NADA técnico.
#   conceptual  → gestión y estrategias de seguridad: políticas, normas, conceptos; sin productos.
#   logical     → conversación con el CISO: servicios de seguridad.
#   physical    → mecanismos concretos.
#   component   → productos y tecnologías.

empresa: NovaPay S.A.
tipo: Compañía de financiamiento digital vigilada por la SFC
area: Gerencia de Pagos Inmediatos
proyecto: Vinculación a Bre-B como participante

mision: >-
  Facilitar que personas y comercios en Colombia muevan su dinero de forma
  inmediata, segura y sin costo desde el celular, protegiendo la confianza de
  los clientes como el activo principal de la compañía.

vision: >-
  Ser en 2030 la billetera digital preferida por los colombianos que hoy usan
  efectivo, reconocida por la seguridad de sus pagos.

objetivo_estrategico: >-
  Duplicar la base de clientes activos en 2027 llevando a {empresa} los pagos
  inmediatos interoperables, sin aumentar la tasa de fraude.

objetivo_proyecto: >-
  Vincular a {empresa} al sistema de pagos inmediatos Bre-B del Banco de la
  República como participante (a través de un sistema de pago certificado y
  liquidando en el MOL con cuenta propia), y lanzar en la app las transferencias
  por llaves y los pagos QR (24/7, en menos de 20 segundos), con una
  arquitectura de seguridad que proteja los fondos y los datos de los clientes
  desde el diseño.

titulo_matriz: >-
  MATRIZ SABSA — Proyecto «{proyecto}» de {empresa} ({area})
